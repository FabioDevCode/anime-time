query SoonAnime($page: Int!, $perPage: Int!) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }

    media(
      type: ANIME
      format: TV
      status: NOT_YET_RELEASED
      sort: START_DATE
      isAdult: false
    ) {
      id

      status

      coverImage {
        large
      }

      title {
        romaji
        english
        native
      }
    }
  }
}
