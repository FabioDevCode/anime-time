query RecentReleasingAnime($page: Int!, $perPage: Int!, $today: FuzzyDateInt!, $search: String) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }
    media(
      type: ANIME
      startDate_lesser: $today
      sort: START_DATE_DESC
      status_in: [RELEASING, FINISHED]
      isAdult: false
      format: TV
      search: $search
    ) {
      id
      status
      coverImage {
        large
      }
      title {
        romaji
        english
        native
      }
    }
  }
}
